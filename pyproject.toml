[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance_md"
version = "0.2.0"
description = "SQLite-backed finance management for multiple accounts: the database is the source of truth, the .md files are generated views."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "finance_md contributors" }]
keywords = ["finance", "accounting", "sqlite", "markdown", "ledger", "personal-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/finance-md/finance_md"
Documentation = "https://github.com/finance-md/finance_md#readme"
Changelog = "https://github.com/finance-md/finance_md/blob/main/CHANGELOG.md"

[project.scripts]
finance-md = "finance_md.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_md"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
